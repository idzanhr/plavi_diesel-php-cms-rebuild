# ---------------------------------------------------------------------------
# Plava nafta – CloudPanel vhost (paste into: Sites → <site> → Vhost, replace all).
#
# Requirements in CloudPanel:
#   * Site type "PHP", PHP 8.3, Varnish cache OFF (the public site is static already).
#   * Settings → Root Directory: <domain>/public      (app/, bin/, sql/ stay outside the web root)
#   * Replace plava-nafta.crodesign93.eu below if you use another domain.
# Keep the {{…}} placeholders – CloudPanel fills them in (certificate, root, logs, PHP-FPM port).
# ---------------------------------------------------------------------------

# Brute-force brake for the admin: only POSTs (login, 2FA code, saves) are limited.
# An empty key is not counted, so normal page loads are never throttled.
map $request_method $plavanafta_post_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $plavanafta_post_key zone=plavanafta_admin:1m rate=30r/m;

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.plava-nafta.crodesign93.eu;
  return 301 https://plava-nafta.crodesign93.eu$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name plava-nafta.crodesign93.eu;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  index index.html;
  charset utf-8;
  server_tokens off;
  error_page 404 /404.html;

  # --- Compression -----------------------------------------------------------
  # The CMS writes index.html.gz, stations.json.gz, site.css.gz … on every save;
  # gzip_static sends those directly (level 9, zero CPU per request).
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # No open_file_cache here on purpose: the CMS swaps files atomically on every save,
  # and a cached file handle would keep serving the old page for up to a minute.

  # --- Public static site ------------------------------------------------------
  # Headers live here (not at server level) so PHP responses keep only the stricter
  # headers PHP sends itself. Nested locations without add_header inherit these.
  location / {
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Pages are regenerated by the CMS: always revalidate (cheap 304 via ETag).
    expires -1;
    # /privatnost and /kolacici (the original URLs) map to their .html files.
    try_files $uri $uri.html $uri/ =404;

    # CSS/JS URLs carry ?v=<content hash>, so they can be cached for a year
    # and never revalidated (immutable). Page headers are not needed on CSS/JS.
    location ^~ /assets/ {
      expires off;  # don't inherit the "no-cache" of pages
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff";
      access_log off;
      try_files $uri =404;
    }
    location ~* \.(?:svg|png|ico|webmanifest)$ {
      expires 7d;
      access_log off;
      try_files $uri =404;
    }
    # Publisher temp files and the .gz twins (gzip_static uses those internally).
    location ~ \.(?:tmp|gz)$ {
      return 404;
    }
  }

  # --- Hidden admin (PHP) ------------------------------------------------------
  location = /plava-nafta {
    return 301 /plava-nafta/;
  }
  location ^~ /plava-nafta/ {
    # The admin entry URL itself → index.php (internal, the address bar stays /plava-nafta/).
    location = /plava-nafta/ {
      rewrite ^ /plava-nafta/index.php last;
    }

    location ~ ^/plava-nafta/(?:index|api)\.php$ {
      limit_req zone=plavanafta_admin burst=15 nodelay;
      limit_req_status 429;
      include fastcgi_params;
      fastcgi_intercept_errors off;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      try_files $uri =404;
      fastcgi_read_timeout 60;
      fastcgi_send_timeout 60;
      fastcgi_param HTTPS "on";
      fastcgi_param SERVER_PORT 443;
      fastcgi_pass 127.0.0.1:{{php_fpm_port}};
      fastcgi_param PHP_VALUE "{{php_settings}}";
    }
    location ^~ /plava-nafta/assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff";
      access_log off;
      try_files $uri =404;
    }
    # Anything else under /plava-nafta/ (other .php, .htaccess, …) does not exist.
    location ~ . {
      return 404;
    }
  }

  # No PHP anywhere else, no dotfiles (.htaccess, .git, .env) – just in case.
  location ~ \.php$ {
    return 404;
  }
  location ~ /\.(?!well-known) {
    return 404;
  }
}
