# Example nginx server block. Web root is public/; app/, bin/ and sql/ stay outside it.
server {
    listen 443 ssl http2;
    server_name plava-nafta.example.hr;
    root /var/www/plava-nafta/public;
    index index.html index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;
    location = /privatnost { try_files /privatnost.html =404; }
    location = /kolacici   { try_files /kolacici.html =404; }
    location ~ \.tmp$      { deny all; }
    location = /index.html { add_header Cache-Control no-cache; }
    location = /data/stations.json { add_header Cache-Control no-cache; }

    location / {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        try_files $uri $uri/ =404;
    }

    location = /plava-nafta { return 301 /plava-nafta/; }
    location ~ ^/plava-nafta/(index|api)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
}
